<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Shooting Game</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

<div id="game">


    <!-- =====================================================
         スタート画面
    ====================================================== -->

    <div id="start-screen">

        <div class="start-title">
            SHOOTING GAME
        </div>

        <button id="start-button">
            START
        </button>

    </div>



    <!-- =====================================================
         カウントダウン
    ====================================================== -->

    <div id="countdown">
        5
    </div>



    <!-- =====================================================
         スコア
    ====================================================== -->

    <div id="score-board">

        <div id="left-score">
            LEFT: 0
        </div>

        <div id="timer">
            Time: 30
        </div>

        <div id="right-score">
            RIGHT: 0
        </div>

    </div>



    <!-- =====================================================
         練習モード
    ====================================================== -->

    <div id="practice-targets"></div>

    <div id="practice-text">
        PRACTICE
    </div>



    <!-- =====================================================
         背景
         後ろ → 前
    ====================================================== -->

    <img
        src="背景.png"
        class="board sky-background">

    <img
        src="山.png"
        class="board mountain">

    <!-- やぎ -->
    <div id="goat-targets"></div>

    <img
        src="土.png"
        class="board soil">

    <!-- 青い的 -->
    <div id="blue-targets"></div>

    <img
        src="畑土.png"
        class="board field-soil">

    <img
        src="畑土2.png"
        class="board field-soil2">

    <img
        src="家.png"
        class="board house">

    <!-- 猫 -->
    <div id="cat-targets"></div>

    <!-- ブルズアイ -->
    <div id="purple-targets"></div>

    <img
        src="草.png"
        class="board grass">

    <!-- レクサー -->
    <div id="rexer-targets"></div>

    <!-- 赤い的 -->
    <div id="red-targets"></div>

    <img
        src="土真ん中.png"
        class="board soil-middle">

    <img
        src="木.png"
        class="board tree">

    <!-- ことり -->
    <div id="bird-targets"></div>

    <img
        src="水.png"
        class="board water">

    <img
        src="水2.png"
        class="board water2">

    <!-- 黄色い的 -->
    <div id="yellow-targets"></div>

    <img
        src="草手前.png"
        class="board grass-front">

    <img
        src="土手前.png"
        class="board soil-front">

    <!-- 緑の的 -->
    <div id="green-targets"></div>

    <!-- オレンジの的 -->
    <div id="orange-targets"></div>

    <img
        src="草最前.png"
        class="board grass-front-most">

    <!-- うさぎ -->
    <div id="rabbit-targets"></div>

    <img
        src="土最前.png"
        class="board soil-front-most">

    <!-- スズメ -->
    <div id="sparrow-targets"></div>

    <!-- チキン -->
    <div id="chicken-targets"></div>

    <img
        src="柵.png"
        class="board fence">



    <!-- =====================================================
         ゲームの周りのフレーム
    ====================================================== -->

    <img
        src="まわり.png"
        class="board game-frame">



    <!-- =====================================================
         照準
    ====================================================== -->

    <div id="crosshair">
        ＋
    </div>



    <!-- =====================================================
         最終結果
    ====================================================== -->

    <div id="final-curtain">

        <div class="final-title">
            RESULT
        </div>

    </div>


    <div id="final-score">

        <div class="result-box">

            <div class="result-left">

                <div class="result-label">
                    LEFT
                </div>

                <div
                    id="final-left-score"
                    class="result-number">
                    0
                </div>

            </div>


            <div class="result-right">

                <div class="result-label">
                    RIGHT
                </div>

                <div
                    id="final-right-score"
                    class="result-number">
                    0
                </div>

            </div>

        </div>

    </div>


</div>


<script src="game.js"></script>

</body>
</html>
